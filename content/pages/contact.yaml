$title: Contact
$path: /{root}/contact/
$order: 3


partials:
- partial: hero
  chapter:
    class: "tst-hero__chapter"
    title@: !g.string ui.contact_hero_title.string
  background_images:
  - class: "background-images__image--contact-header tst-desktop-only"
    url: "/static/images/contact/tim-stafford-contact-header.jpg"
  - class: "background-images__image--contact-header tst-mobile-only"
    url: "/static/images/contact/tim-stafford-contact-header-mobile.jpg"

- partial: section
  class: "tst-section--contact-intro"
  sections:
  - class: "tst-section__item--centered"
    chapter:
      title@: !g.string ui.contact_intro_title.string
      subtitle@: !g.string ui.contact_intro_subtitle.string
      body@: !g.string ui.contact_intro_body.string

- partial: form
  class: "tst-form--contact"
  form: !g.yaml /content/partials/contact-form.yaml

- partial: section
  class: "tst-section--steps"
  sections:
  - class: "tst-section__item--centered"
    chapter:
      title@: !g.string ui.contact_steps_title.string
      body@: !g.string ui.contact_steps_body.string
