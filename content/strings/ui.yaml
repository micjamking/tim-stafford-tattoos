contact_success_title:
  string@: Your idea's in.
contact_success_body:
  string@: 'I read every inquiry myself and typically reply within 3 business days.


    Have reference images? Reply to your confirmation email and attach them there.


    If the email doesn''t arrive, check spam, then contact <a href="mailto:timstaffordtattoos@gmail.com">timstaffordtattoos@gmail.com</a>.'
contact_steps_title:
  string@: What happens next
contact_steps_body:
  string@: '1. **I review your idea.** I read inquiries personally and typically reply within 3 business days.

    2. **We talk it through.** If we''re a good fit, we''ll arrange a free consultation at the studio or over video.

    3. **We book your tattoo.** We discuss size, sessions, pricing, and timing. A deposit reserves your appointment.'
